services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - --configFile=/config/traefik.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: true
      # TLD comes from .env (see .env.example). Compose fails fast if it is unset.
      traefik.http.routers.traefik.rule: Host("traefik") || Host("traefik.${TLD:?TLD is not set in .env (see .env.example)}")
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.services.traefik.loadbalancer.server.port: 8080
      traefik.http.routers.traefik.middlewares: traefik
      traefik.http.middlewares.traefik.redirectScheme.scheme: https
      traefik.http.routers.traefik.observability.accesslogs: false

      traefik.http.routers.traefik-https.rule: Host("traefik") || Host("traefik.${TLD:?TLD is not set in .env (see .env.example)}")
      traefik.http.routers.traefik-https.entrypoints: websecure
      traefik.http.routers.traefik-https.tls: true
      traefik.http.routers.traefik-https.observability.accesslogs: false
    networks:
      default: {}
      app-bridge:
        # A container that logs in through authentik over OIDC (Dockhand)
        # talks to it server-side, and has to use the very URL the browser
        # uses — https://authentik.$TLD — or the issuer in the tokens will not
        # match. Answering to that name here makes Docker's own DNS resolve it
        # to Traefik for everything on app-bridge: no dependency on Pi-hole
        # being up, and no hairpin through the host's published ports.
        aliases:
          - authentik.${TLD:?TLD is not set in .env (see .env.example)}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  app-bridge:
    driver: bridge
    name: app-bridge

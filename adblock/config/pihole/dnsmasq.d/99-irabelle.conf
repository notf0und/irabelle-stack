# Extra dnsmasq configuration, read by Pi-hole's FTL.
#
# Pi-hole only reads /etc/dnsmasq.d when FTLCONF_misc_etc_dnsmasq_d is true
# (set in compose.yml). If local names stop resolving, check that setting under
# Pi-hole's Settings -> All settings -> misc.etc_dnsmasq_d.

# Every name under .smart resolves to the host that runs Traefik, so a single
# wildcard covers every service — present and future — with no per-service
# records to maintain. The leading dot is the form the station build uses;
# `/.smart/` and `/smart/` are equivalent, and both match .smart and every
# subdomain of it.
#
# Change the address here if this server's LAN address ever changes.
address=/.smart/192.168.1.2

# ...and keep the rest of the .smart namespace local as well.
#
# Since dnsmasq 2.86 an `address=` rule only answers A and AAAA queries: any
# other record type for that domain — HTTPS/SVCB, MX, TXT, SOA — is forwarded
# upstream. Browsers do query types beyond A/AAAA, so without this line those
# lookups leave the box for a namespace that will never exist in public DNS.
# They come back NXDOMAIN after a pointless round trip, and they cannot be
# answered at all when the uplink is down.
#
# It matters more if the TLD is ever a domain you actually own: forwarding
# those queries leaks internal hostnames to the upstream resolver. `local=` is
# dnsmasq's documented fix — it answers those types itself (NODATA/NXDOMAIN)
# and never forwards. Do not "tidy" it away as redundant with the line above.
local=/.smart/

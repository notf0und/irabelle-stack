# Mosquitto — the smarthome stack's MQTT broker.
#
# Login required: the password file is written from smarthome/.env (MQTT_USER,
# MQTT_PASSWORD) every time the container starts, see compose.yml.

listener 1883
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout

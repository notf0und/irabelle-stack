# irabelle — everything authentik needs to know about this install.
#
# The worker applies this on start and re-applies it whenever it changes, so
# this file, not authentik's UI, is where these objects are defined. Values
# come from authentik/.env (read with !Env), so nothing here is per-install.
#
#   * the admin user (ADMIN_USERNAME / ADMIN_PASSWORD) — created once,
#     `state: created`, so a password changed in authentik's UI stays changed
#   * Dockhand: an OIDC client; ./setup.sh registers the matching provider on
#     Dockhand's side
#   * Pi-hole and the media apps without a login of their own (Sonarr, Radarr,
#     Prowlarr, Bazarr, Transmission, Lingarr, Byparr, Calibre, Calibre-Web):
#     forward-auth proxy providers, served by the embedded outpost that
#     Traefik's `authentik` middleware talks to
#   * Kavita, Shelfmark and Cleanuparr: OIDC clients, like Dockhand's;
#     ./setup.sh configures each app's side
#
# Every application is bound to the `authentik Admins` group, so a user added
# to authentik later for something else gets into none of them.
version: 1
metadata:
  name: irabelle
  labels:
    blueprints.goauthentik.io/description: Admin user, OIDC clients and forward-auth providers for irabelle-stack
context:
  tld: !Env [TLD, smart]
  username: !Env ADMIN_USERNAME
  password: !Env ADMIN_PASSWORD
  email: !Env [ADMIN_EMAIL, ""]
  dockhand_secret: !Env DOCKHAND_OIDC_CLIENT_SECRET
  kavita_secret: !Env KAVITA_OIDC_CLIENT_SECRET
  shelfmark_secret: !Env SHELFMARK_OIDC_CLIENT_SECRET
  cleanuparr_secret: !Env CLEANUPARR_OIDC_CLIENT_SECRET
entries:
  # --- what this depends on ----------------------------------------------------
  # Blueprints are applied in no particular order on a fresh database. Every
  # !Find below looks up an object one of these creates, so make sure they
  # have run first rather than find nothing and silently store a null.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/bootstrap.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-proxy.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-authentication-flow.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: false

  # --- the admin user ----------------------------------------------------------
  - model: authentik_core.user
    state: created
    identifiers:
      username: !Context username
    attrs:
      name: !Context username
      email: !Context email
      password: !Context password
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]
  # The email, kept in step with ADMIN_EMAIL even for a user created before it
  # was set: Kavita matches the authentik login to its own account by email.
  - model: authentik_core.user
    state: present
    conditions:
      - !Context email
    identifiers:
      username: !Context username
    attrs:
      email: !Context email

  # --- Dockhand: OIDC ----------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: dockhand-provider
    identifiers:
      name: Dockhand
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: dockhand
      client_secret: !Context dockhand_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://dockhand.%s/api/auth/oidc/callback", !Context tld]
          redirect_uri_type: authorization
      # Not defaulted for a provider made by a blueprint: without it every
      # login fails with "The request is otherwise malformed".
      grant_types:
        - authorization_code
        - refresh_token
      # Dockhand matches on the username claim, and links the OIDC login to the
      # local Dockhand user setup.sh created with the same name.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: dockhand-app
    identifiers:
      slug: dockhand
    attrs:
      name: Dockhand
      provider: !KeyOf dockhand-provider
      meta_launch_url: !Format ["https://dockhand.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dockhand-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # --- Pi-hole: forward auth ---------------------------------------------------
  # forward_single: one application behind one host. Traefik's `authentik`
  # middleware asks the embedded outpost about every request to that host;
  # Pi-hole itself runs with no password (see adblock/compose.yml).
  - model: authentik_providers_proxy.proxyprovider
    id: pihole-provider
    identifiers:
      name: Pi-hole
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://pihole.%s", !Context tld]
  - model: authentik_core.application
    id: pihole-app
    identifiers:
      slug: pihole
    attrs:
      name: Pi-hole
      provider: !KeyOf pihole-provider
      meta_launch_url: !Format ["https://pihole.%s/admin/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pihole-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # --- the email claim, marked verified ----------------------------------------
  # authentik's own email mapping says email_verified: false, and Shelfmark
  # (like Kavita) only links a login to the account setup.sh made for you when
  # the address is verified — otherwise it makes a second account. The address
  # is one setup.sh set (ADMIN_EMAIL), and only `authentik Admins` can reach
  # these apps at all, so it is vouched for here.
  - model: authentik_providers_oauth2.scopemapping
    id: email-verified
    identifiers:
      name: "irabelle: OpenID 'email' (verified)"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {"email": request.user.email, "email_verified": True}

  # --- media apps: OIDC ---------------------------------------------------------
  # Apps that speak OIDC themselves. ./setup.sh configures the other side of
  # each (issuer https://authentik.$TLD/application/o/<slug>/, client id
  # <slug>, the secret from authentik/.env).
  # Kavita: links the login to the local Kavita admin setup.sh creates, by email.
  - model: authentik_providers_oauth2.oauth2provider
    id: kavita-provider
    identifiers:
      name: Kavita
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: kavita
      client_secret: !Context kavita_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://kavita.%s/signin-oidc", !Context tld]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["https://kavita.%s/signout-callback-oidc", !Context tld]
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: kavita-app
    identifiers:
      slug: kavita
    attrs:
      name: Kavita
      provider: !KeyOf kavita-provider
      meta_launch_url: !Format ["https://kavita.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kavita-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # Shelfmark: `authentik Admins` in the groups claim makes the user a Shelfmark admin.
  - model: authentik_providers_oauth2.oauth2provider
    id: shelfmark-provider
    identifiers:
      name: Shelfmark
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: shelfmark
      client_secret: !Context shelfmark_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://shelfmark.%s/api/auth/oidc/callback", !Context tld]
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: shelfmark-app
    identifiers:
      slug: shelfmark
    attrs:
      name: Shelfmark
      provider: !KeyOf shelfmark-provider
      meta_launch_url: !Format ["https://shelfmark.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf shelfmark-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # Cleanuparr: the second URI is its "link account" flow.
  - model: authentik_providers_oauth2.oauth2provider
    id: cleanuparr-provider
    identifiers:
      name: Cleanuparr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: cleanuparr
      client_secret: !Context cleanuparr_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://cleanuparr.%s/api/auth/oidc/callback", !Context tld]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["https://cleanuparr.%s/api/account/oidc/link/callback", !Context tld]
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: cleanuparr-app
    identifiers:
      slug: cleanuparr
    attrs:
      name: Cleanuparr
      provider: !KeyOf cleanuparr-provider
      meta_launch_url: !Format ["https://cleanuparr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf cleanuparr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # --- media apps: forward auth ------------------------------------------------
  # Same as Pi-hole: one forward_single provider per host, for the apps that
  # have no login of their own (or have it switched to External). Each one's
  # router lists `authentik@docker` in its middlewares (arr/, books/).
  - model: authentik_providers_proxy.proxyprovider
    id: sonarr-provider
    identifiers:
      name: Sonarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://sonarr.%s", !Context tld]
  - model: authentik_core.application
    id: sonarr-app
    identifiers:
      slug: sonarr
    attrs:
      name: Sonarr
      provider: !KeyOf sonarr-provider
      meta_launch_url: !Format ["https://sonarr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sonarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: radarr-provider
    identifiers:
      name: Radarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://radarr.%s", !Context tld]
  - model: authentik_core.application
    id: radarr-app
    identifiers:
      slug: radarr
    attrs:
      name: Radarr
      provider: !KeyOf radarr-provider
      meta_launch_url: !Format ["https://radarr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf radarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: prowlarr-provider
    identifiers:
      name: Prowlarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://prowlarr.%s", !Context tld]
  - model: authentik_core.application
    id: prowlarr-app
    identifiers:
      slug: prowlarr
    attrs:
      name: Prowlarr
      provider: !KeyOf prowlarr-provider
      meta_launch_url: !Format ["https://prowlarr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prowlarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: bazarr-provider
    identifiers:
      name: Bazarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://bazarr.%s", !Context tld]
  - model: authentik_core.application
    id: bazarr-app
    identifiers:
      slug: bazarr
    attrs:
      name: Bazarr
      provider: !KeyOf bazarr-provider
      meta_launch_url: !Format ["https://bazarr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bazarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: transmission-provider
    identifiers:
      name: Transmission
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://transmission.%s", !Context tld]
  - model: authentik_core.application
    id: transmission-app
    identifiers:
      slug: transmission
    attrs:
      name: Transmission
      provider: !KeyOf transmission-provider
      meta_launch_url: !Format ["https://transmission.%s/transmission/web/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf transmission-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: lingarr-provider
    identifiers:
      name: Lingarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://lingarr.%s", !Context tld]
  - model: authentik_core.application
    id: lingarr-app
    identifiers:
      slug: lingarr
    attrs:
      name: Lingarr
      provider: !KeyOf lingarr-provider
      meta_launch_url: !Format ["https://lingarr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf lingarr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: byparr-provider
    identifiers:
      name: Byparr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://byparr.%s", !Context tld]
  - model: authentik_core.application
    id: byparr-app
    identifiers:
      slug: byparr
    attrs:
      name: Byparr
      provider: !KeyOf byparr-provider
      meta_launch_url: !Format ["https://byparr.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf byparr-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: calibre-provider
    identifiers:
      name: Calibre
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://calibre.%s", !Context tld]
  - model: authentik_core.application
    id: calibre-app
    identifiers:
      slug: calibre
    attrs:
      name: Calibre
      provider: !KeyOf calibre-provider
      meta_launch_url: !Format ["https://calibre.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: calibre-web-automated-provider
    identifiers:
      name: Calibre-Web
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Format ["https://calibre-web-automated.%s", !Context tld]
  - model: authentik_core.application
    id: calibre-web-automated-app
    identifiers:
      slug: calibre-web-automated
    attrs:
      name: Calibre-Web
      provider: !KeyOf calibre-web-automated-provider
      meta_launch_url: !Format ["https://calibre-web-automated.%s/", !Context tld]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-web-automated-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0

  # The embedded outpost runs inside the authentik container and is what answers the
  # middleware. It only serves the providers listed here, so every
  # forward-auth provider above must be added to this list too.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf pihole-provider
        - !KeyOf sonarr-provider
        - !KeyOf radarr-provider
        - !KeyOf prowlarr-provider
        - !KeyOf bazarr-provider
        - !KeyOf transmission-provider
        - !KeyOf lingarr-provider
        - !KeyOf byparr-provider
        - !KeyOf calibre-provider
        - !KeyOf calibre-web-automated-provider
      config:
        # Where the outpost sends a browser to log in. Without it, it guesses
        # from the request, which inside Docker is the container's own name.
        authentik_host: !Format ["https://authentik.%s/", !Context tld]
